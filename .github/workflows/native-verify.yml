name: Native verification

on:
  pull_request:
  push:
    branches:
      - main
      - codex/barbershop-release-candidate

permissions:
  contents: read

jobs:
  verify-web-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high
