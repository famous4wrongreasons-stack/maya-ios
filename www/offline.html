<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Мужская Эстетика — нет соединения</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{
    background:#000;color:#f4f0eb;
    font-family:'Montserrat',-apple-system,sans-serif;font-weight:300;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:32px;overflow:hidden;
  }
  .wrap{max-width:440px;text-align:center;animation:fadeIn 1s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  .logo{margin:0 auto 48px;display:block;opacity:0.9}
  .label{font-size:10px;letter-spacing:0.35em;text-transform:uppercase;opacity:0.5;margin-bottom:24px}
  h1{font-family:'Montserrat',sans-serif;font-size:clamp(24px,5vw,36px);font-weight:200;
    letter-spacing:0.08em;text-transform:uppercase;line-height:1.2;margin-bottom:24px}
  h1 em{font-style:normal;opacity:0.4}
  p{font-size:13px;line-height:1.8;opacity:0.55;letter-spacing:0.05em;margin-bottom:48px}
  .btn{display:inline-block;padding:18px 52px;border:1px solid rgba(244,240,235,0.4);
    color:#f4f0eb;background:transparent;text-decoration:none;font-family:inherit;
    font-size:11px;font-weight:300;letter-spacing:0.3em;text-transform:uppercase;
    cursor:pointer;transition:all 0.4s ease;position:relative;overflow:hidden}
  .btn::before{content:'';position:absolute;inset:0;background:#f4f0eb;
    transform:translateX(-100%);transition:transform 0.4s ease;z-index:-1}
  .btn:hover{color:#000;border-color:#f4f0eb}
  .btn:hover::before{transform:translateX(0)}
</style>
</head>
<body>
  <div class="wrap">
    <svg class="logo" width="64" height="64" viewBox="290 330 458 380" xmlns="http://www.w3.org/2000/svg">
      <g fill="#f4f0eb">
        <rect x="313" y="346" width="24" height="342"/>
        <rect x="697" y="346" width="24" height="342"/>
        <path d="M398 388 L421 388 L517 555 L613 388 L636 388 L636 615 L612 615 L612 429 L529 576 L505 576 L422 429 L422 615 L398 615 Z"/>
      </g>
    </svg>
    <div class="label">Нет соединения</div>
    <h1>Связь <em>прервалась</em></h1>
    <p>Проверьте подключение к&nbsp;интернету<br>и&nbsp;попробуйте ещё раз</p>
    <button class="btn" onclick="location.reload()">Повторить</button>
  </div>
</body>
</html>
