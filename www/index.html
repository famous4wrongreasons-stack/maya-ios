            try{ window.__panelInfo=me; window.__meRole=me.role||null; window.__meIsMaster=!!me.is_master; window.__meIsFounder=!!me.is_founder; window.__meStaffName=((me.role==='owner'||me.role==='manager'||me.role==='master'||me.is_master)?(me.master_name||me.name||null):null); /* staff avatar fallback: salon photo by staff_id when Telegram login gave no photo */ if(!window.__meAvatar && me.staff_id && window.__meMasterPhoto){ var _mp=window.__meMasterPhoto(me.staff_id); if(_mp) window.__meAvatar=_mp; } /* реальное фото из Telegram: вход с иконки (deep-link) его не отдаёт — тянем с бэка по сессии (me_photo), оно перекрывает салонный fallback */ if(me && (me.role || me.is_master)){ try{ fetch(PROXY+'?action=me_photo',{method:'POST',headers:rq.headers,body:rq.body}).then(function(r){return r.json();}).then(function(_ph){ if(_ph && _ph.photo){ window.__meAvatar=_ph.photo; if(window.__meRefresh)window.__meRefresh(); } }).catch(function(){}); }catch(e){} } var pp=(me.permissions)||{}; window.__meIsStaff=!!(pp.dashboard||me.is_master||pp.redeem); if(window.__meRefresh)window.__meRefresh(); }catch(e3){}
            var want = staff?'1':'0';
            if(want!==cached){ if(staff){ window.__meGo('choose'); } else { if(window.__meMode)window.__meMode('client'); window.__meGo(freshLogin?'cabinet':'home'); } }
          })
          .catch(function(){ if(_roleAttempt < 3){ setTimeout(_tryRole, 1500*_roleAttempt); return; } if(cached===null){ if(window.__meMode)window.__meMode('client'); window.__meGo('home'); }; });
      };
      _tryRole();
    }catch(e){ if(cached===null){ if(window.__meMode)window.__meMode('client'); window.__meGo('home'); }; }
    return true;
  }
  window.__meHasSession = hasSession;
  window.__meLogout = function(){ try{ localStorage.removeItem('web_session_token'); localStorage.removeItem('tg_auth_data'); localStorage.removeItem('tg_guest_mode'); }catch(e){} if(window.__meGo) window.__meGo('login'); };

  // ── 4. На старте: сперва ловим возврат VK (?code), затем — если есть сессия, минуем логин ──
  async function boot(){
    var p=new URLSearchParams(location.search);
    if(p.get('code')){ await handleVkRedirect(); return; } // reload произойдёт внутри
    var tries=0;
    var t=setInterval(function(){
      tries++;
      if(window.__meGo){ clearInterval(t); meAuthRoute(); }
      else if(tries>60){ clearInterval(t); }
    },50);
  }
  if(document.readyState==='complete'||document.readyState==='interactive') boot();
  else document.addEventListener('DOMContentLoaded',boot);
})();

</script>
